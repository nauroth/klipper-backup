#####################################################################
##   Probe - CNC Tap V2
#####################################################################

##   CNC Tap V2 angeschlossen am EBB36 Probe-Port (PB9)
##   Polarität prüfen mit QUERY_PROBE: Düse frei = "open",
##   Düse nach oben gedrückt = "TRIGGERED". Falls umgekehrt, "!" hinzufügen.
[probe]
pin: ^!EBBCan:PB9
x_offset: 0
y_offset: 0
##   z_offset steht im SAVE_CONFIG-Block am Ende von printer.cfg
##   (PROBE_CALIBRATE -> ACCEPT -> SAVE_CONFIG). Nicht hier eintragen,
##   sonst meldet SAVE_CONFIG "conflicts with included value".
#z_offset: -0.868
speed: 5.0
lift_speed: 10
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
activate_gcode:
    ##   Tap: Düse beim Proben max. 150°C, schont das Druckbett
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

##   Voron Standard: Motoren erst nach 30 min Leerlauf abschalten
[idle_timeout]
timeout: 1800

##   Z wird in der Bettmitte gehomed (X 0-242 / Y 0-259)
[safe_z_home]
home_xy_position: 121, 129
speed: 150
z_hop: 10
z_hop_speed: 25


#####################################################################
##   Quad Gantry Level - Voron 2.4 250mm
#####################################################################

##   Reihenfolge der Z-Motoren / Punkte:
##   Z (vorne links), Z1 (hinten links), Z2 (hinten rechts), Z3 (vorne rechts)
[quad_gantry_level]
gantry_corners:
    -60,-10
    310, 320
##   Probe-Punkte (Tap: Offset 0/0 -> Düsenposition)
points:
    50,25
    50,175
    200,175
    200,25
speed: 150
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#####################################################################
##   Bed Mesh
#####################################################################

##   9x9 = 81 Punkte zum Prüfen der Bettebenheit
##   Tap Offset 0/0 -> Koordinaten = Düsenposition (X 0-242 / Y 0-259)
##   Ablauf: G32, dann BED_MESH_CALIBRATE, Ansicht in Mainsail "Heightmap"
[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 217, 234
probe_count: 9, 9
algorithm: bicubic
mesh_pps: 2, 2
fade_start: 0.6
fade_end: 10.0
##   Mesh-Nullpunkt = Z-Homing-Punkt (Bettmitte)
zero_reference_position: 121, 129

[gcode_macro G32]
description: Home, Quad Gantry Level, Home Z
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    QUAD_GANTRY_LEVEL
    G28 Z
    G0 X121 Y129 Z30 F6000
    RESTORE_GCODE_STATE NAME=STATE_G32


#####################################################################
##   Extruder Motor and Stepper Settings 
#####################################################################

##   Extruder LDO Orbiter V2.5 (BTT)
##   Vorgaben: https://www.orbiterprojects.com/orbiter-v2-0/
##   Motor LDO-36STH20-1004AHG
##   Driver TMC2209 Rsense 0,11Ohm (auf EBB 36 CAN V1.2(G0B1))
##   Hotend Rapido V2 Plus HF
##   https://github.com/Phaetus/Rapido-2-Plus
##   Connected über CAN
[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.682
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: PT1000
sensor_pin: EBBCan: PA3
##   RTD PT1000 B Thermistor im Rapido V2 Plus 
control: pid
pid_Kp=34.998
pid_Ki=11.111
pid_Kd=27.561
min_temp: 0
max_temp: 350
max_power: 1.0
min_extrude_temp: 190
##   Für KAMP "Adaptive Purging"
max_extrude_cross_section: 5
##   Wird über Marco gesetzt
#pressure_advance: 0.02
#pressure_advance_smooth_time: 0.030

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: auto
voltage: 24

[tmc2209 extruder]
uart_pin: EBBCan: PA15
interpolate: true
run_current: 0.850
sense_resistor: 0.110
#stealthchop_threshold: 0
#driver_TBL: 0
#driver_HEND: 6
#driver_HSTRT: 7
#driver_TOFF: 4




