# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

# See docs/Config_Reference.md for a description of parameters.



#####################################################################
##   Printer Settings
#####################################################################


[printer]
kinematics: corexy
max_z_velocity: 50
##   This sets the maximum velocity (in mm/s) of movement along the z
##   axis. This setting can be used to restrict the maximum speed of
##   the z stepper motor. The default is to use max_velocity for
##   max_z_velocity.
max_z_accel: 350
##   This sets the maximum acceleration (in mm/s^2) of movement along
##   the z axis. It limits the acceleration of the z stepper motor. The
##   default is to use max_accel for max_z_accel.
max_velocity: 500
##   Maximum velocity (in mm/s) of the toolhead (relative to the
##   print). This value may be changed at runtime using the
##   SET_VELOCITY_LIMIT command. This parameter must be specified.
max_accel: 8100
##   Maximum acceleration (in mm/s^2) of the toolhead (relative to the
##   print). Although this parameter is described as a "maximum"
##   acceleration, in practice most moves that accelerate or decelerate
##   will do so at the rate specified here. The value specified here
##   may be changed at runtime using the SET_VELOCITY_LIMIT command.
##   This parameter must be specified.
#minimum_cruise_ratio: 0.5
##   Most moves will accelerate to a cruising speed, travel at that
##   cruising speed, and then decelerate. However, some moves that
##   travel a short distance could nominally accelerate and then
##   immediately decelerate. This option reduces the top speed of these
##   moves to ensure there is always a minimum distance traveled at a
##   cruising speed. That is, it enforces a minimum distance traveled
##   at cruising speed relative to the total distance traveled. It is
##   intended to reduce the top speed of short zigzag moves (and thus
##   reduce printer vibration from these moves). For example, a
##   minimum_cruise_ratio of 0.5 would ensure that a standalone 1.5mm
##   move would have a minimum cruising distance of 0.75mm. Specify a
##   ratio of 0.0 to disable this feature (there would be no minimum
##   cruising distance enforced between acceleration and deceleration).
##   The value specified here may be changed at runtime using the
##   SET_VELOCITY_LIMIT command. The default is 0.5.
square_corner_velocity: 5.0
##   The maximum velocity (in mm/s) that the toolhead may travel a 90
##   degree corner at. A non-zero value can reduce changes in extruder
##   flow rates by enabling instantaneous velocity changes of the
##   toolhead during cornering. This value configures the internal
##   centripetal velocity cornering algorithm; corners with angles
##   larger than 90 degrees will have a higher cornering velocity while
##   corners with angles less than 90 degrees will have a lower
##   cornering velocity. If this is set to zero then the toolhead will
##   decelerate to zero at each corner. The value specified here may be
##   changed at runtime using the SET_VELOCITY_LIMIT command. The
##   default is 5mm/s.



#####################################################################
##   X Motor and Stepper Settings
#####################################################################

##   Getunt für SpreadCycle Mode: https://github.com/MakerBogans/docs/wiki/TMC-Driver-Tuning
##   Treiber BTT TMC5160T Plus 0,022Ohm Sense Resistor
##   Motor LDO-42STH48-2804AH 1.8° 48MM Nema 17 2,8A Rated Current 0,7Ohm Phase Re4sistance 0,6mH Phase Inductance 84,5g/cm² Inertia
##   B Stepper - Gantry Left / Connected to MOTOR 1
##   Aktuell via TMC Autotune https://github.com/andrewmcgr/klipper_tmc_autotune

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
rotation_distance: 40
##   Distance (in mm) that the axis travels with one full rotation of
##   the stepper motor.
##   This parameter must be provided.
microsteps: 64
##   The number of microsteps the stepper motor driver uses. This
##   parameter must be provided.
##   A value between 64 and 256. 64 seem safe
full_steps_per_rotation: 200
##   The number of full steps for one rotation of the stepper motor.
##   Set this to 200 for a 1.8 degree stepper motor or set to 400 for a
##   The default is 200.
endstop_pin: EBBCan: PB6
position_min: 0
##   Minimum valid distance (in mm) the user may command the stepper to
##   move to.  The default is 0mm.
position_endstop: 242
##   Location of the endstop (in mm). This parameter must be provided
##   for the X, Y, and Z steppers on cartesian style printers.
position_max: 242
##   Maximum valid distance (in mm) the user may command the stepper to
##   move to. This parameter must be provided for the X, Y, and Z
##   steppers on cartesian style printers.
homing_speed: 30
##   Maximum velocity (in mm/s) of the stepper when homing. The default
##   is 5mm/s.
homing_retract_dist: 30
##   Distance to backoff (in mm) before homing a second time during
##   homing. Set this to zero to disable the second home. The default
##   is 5mm.
homing_retract_speed: 30
##   Speed to use on the retract move after homing in case this should
##   be different from the homing speed, which is the default for this
##   parameter
second_homing_speed: 15
##   Velocity (in mm/s) of the stepper when performing the second home.
##   The default is homing_speed/2.
homing_positive_dir: true
##   If true, homing will cause the stepper to move in a positive
##   direction (away from zero); if false, home towards zero. It is
##   better to use the default than to specify this parameter. The
##   default is true if position_endstop is near position_max and false
##   if near position_min.

[autotune_tmc stepper_x]
motor: ldo-42sth48-2804ah
tuning_goal: silent
## auto, silent, performance
voltage: 48

[tmc5160 stepper_x]
cs_pin: PC13
##   The pin corresponding to the TMC5160 chip select line. This pin
##   will be set to low at the start of SPI messages and raised to high
##   after the message completes. This parameter must be provided.
spi_software_miso_pin: PG7
spi_software_mosi_pin: PG6
spi_software_sclk_pin: PG8
##   Specify the above parameters to use "software based SPI". This
##   mode does not require micro-controller hardware support (typically
##   any general purpose pins may be used). The default is to not use
##   "software spi".
interpolate: false
##   If true, enable step interpolation (the driver will internally
##   step at a rate of 256 micro-steps). The default is True.
##   https://www.klipper3d.org/TMC_Drivers.html
##   Auf False. Da stealthChop benutzt wird rest lassen.
run_current: 1.4
##   The amount of current (in amps RMS) to configure the driver to use
##   during stepper movement. This parameter must be provided.
sense_resistor: 0.022
##   The resistance (in ohms) of the motor sense resistor. The default
##   is 0.075 ohms.
#stealthchop_threshold: 0
#stealthchop_threshold: 999999
##   The velocity (in mm/s) to set the "stealthChop" threshold to. When
##   set, "stealthChop" mode will be enabled if the stepper motor
##   velocity is below this value. The default is 0, which disables
##   "stealthChop" mode.
#driver_TBL: 1
##   Blanking Time
#driver_TOFF: 3
##   Time to Slow Decay
#driver_HEND: 3
##   Hysteresis end
#driver_HSTRT: 5
##   Hysteresis start


