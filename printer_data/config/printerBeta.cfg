#####################################################################
##  VORON 2.4 250mm - printerBeta.cfg
##  Clean base config built from printer.cfg (voron2.4 branch), the
##  tested machine.cfg (oldVoron branch), the parts inventory and the
##  BTT / Klipper / Voron reference configs. See TODO.md next to this
##  file for the open checks and the first-start test order.
##
##  Hardware (from the inventory):
##    Board      BTT Manta M8P V2.0 + CM4 (CAN bridge)
##    Toolhead   BTT EBB36 CAN V1.2, Orbiter 2.5, Rapido 2 Plus UHF,
##               Orbiter filament sensor, Chaoticlab CNC Tap V2
##    X/Y (A/B)  LDO-42STH48-2804AH, TMC5160T Plus @ 48V
##    Z (x4)     LDO-42STH48-2504MAC(F) 0.9deg, TMC2209 @ 24V
##    Bed        8mm aluminium, Omron G3NB-210B-1 SSR
##    Screen     BTT Pi TFT43 V2.1 (KlipperScreen, no [display] here)
##
##  Requires on the printer: mainsail.cfg (mainsail-config),
##  klipper_tmc_autotune (installed) and Shake&Tune (TODO.md step 2).
##  Works on mainline Klipper and on Kalico (no Kalico-only sections).
#####################################################################

[include mainsail.cfg]
## Enable after the camera and moonraker-timelapse are set up (TODO.md)
#[include timelapse.cfg]


#####################################################################
##  MCUs
#####################################################################

## Manta M8P V2.0, flashed as USB-to-CAN bridge.
## Only canbus_uuid: a "serial:" line next to it stops Klipper from starting.
[mcu]
canbus_uuid: c1186ab12c17

## EBB36 CAN V1.2 on the toolhead
[mcu EBBCan]
canbus_uuid: 7f06ab490466


#####################################################################
##  Printer
#####################################################################

[printer]
kinematics: corexy
## Conservative until input shaping is done with Shake&Tune.
## Raise afterwards to what the shaper graphs recommend.
max_velocity: 300
max_accel: 5000
## 0.9deg Z motors with 80:16 gearing lose torque fast above ~20mm/s.
## Also limits the gantry lift speed that was quacking.
max_z_velocity: 20
max_z_accel: 350
square_corner_velocity: 5.0

[temperature_sensor Manta_M8P]
sensor_type: temperature_mcu

[temperature_sensor EBB36]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[temperature_sensor CM4]
sensor_type: temperature_host


#####################################################################
##  X/Y - LDO-42STH48-2804AH on TMC5160T Plus (48V)
#####################################################################

## X = B motor, MOTOR1. Endstop on the EBB36 endstop port.
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: EBBCan:PB6
position_min: 0
position_endstop: 242
position_max: 242
homing_speed: 30
homing_retract_dist: 10
homing_positive_dir: true

[tmc5160 stepper_x]
cs_pin: PC13
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
## autotune_tmc manages the chopper and StealthChop settings
interpolate: true
run_current: 1.4
## 5160T Plus = 0.022. Never remove: Klipper's default 0.075 would
## drive ~3.4x the set current into driver and motor.
sense_resistor: 0.022

[autotune_tmc stepper_x]
motor: ldo-42sth48-2804ah
voltage: 48
tuning_goal: performance

## Y = A motor, MOTOR2. Endstop on the Manta (STOP1).
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PF3
position_min: 0
position_endstop: 259
position_max: 259
homing_speed: 30
homing_retract_dist: 10
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PE3
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
interpolate: true
run_current: 1.4
sense_resistor: 0.022

[autotune_tmc stepper_y]
motor: ldo-42sth48-2804ah
voltage: 48
tuning_goal: performance


#####################################################################
##  Z - LDO-42STH48-2504MAC(F) 0.9deg on TMC2209 (24V)
#####################################################################

## Same values as "ldo-42sth48-2504macf" in the current autotune
## database. Kept here under its own name so it also works with the
## older autotune version installed on the printer.
[motor_constants ldo-42sth48-2504mac]
resistance: 1.2
inductance: 0.0015
holding_torque: 0.45
max_current: 2.5
steps_per_revolution: 400

## Z0 - front left, MOTOR4. Z endstop is the Tap (probe).
[stepper_z]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 210
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PB5
interpolate: true
## Voron default for Z. Less driver heat than the old 0.976A (OTPW).
run_current: 0.8
sense_resistor: 0.110

[autotune_tmc stepper_z]
motor: ldo-42sth48-2504mac
voltage: 24
## StealthChop: SpreadCycle was tested and was louder
tuning_goal: silent

## Z1 - rear left, MOTOR5
[stepper_z1]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
full_steps_per_rotation: 400

[tmc2209 stepper_z1]
uart_pin: PG14
interpolate: true
run_current: 0.8
sense_resistor: 0.110

[autotune_tmc stepper_z1]
motor: ldo-42sth48-2504mac
voltage: 24
tuning_goal: silent

## Z2 - rear right, MOTOR6
[stepper_z2]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
full_steps_per_rotation: 400

[tmc2209 stepper_z2]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110

[autotune_tmc stepper_z2]
motor: ldo-42sth48-2504mac
voltage: 24
tuning_goal: silent

## Z3 - front right, MOTOR7
[stepper_z3]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
full_steps_per_rotation: 400

[tmc2209 stepper_z3]
uart_pin: PD5
interpolate: true
run_current: 0.8
sense_resistor: 0.110

[autotune_tmc stepper_z3]
motor: ldo-42sth48-2504mac
voltage: 24
tuning_goal: silent


#####################################################################
##  Extruder - Orbiter 2.5 (LDO-36STH20-1004AHG) + Rapido 2 Plus UHF
#####################################################################

[extruder]
step_pin: EBBCan:PD0
dir_pin: EBBCan:PD1
enable_pin: !EBBCan:PD2
## The Orbiter's 7.5:1 reduction is already inside rotation_distance
## (Orbiter default 4.637), so no gear_ratio. 4.682 = previous owner's
## calibrated value; recalibrate with the 100mm test (TODO.md).
rotation_distance: 4.682
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:PB13
## Rapido 2 PT1000 on TH0. No PT1000 jumper fitted = 4.7k pull-up
## (Klipper default). If the jumper is ever fitted: pullup_resistor: 2200
sensor_type: PT1000
sensor_pin: EBBCan:PA3
min_temp: 0
max_temp: 300
max_power: 1.0
min_extrude_temp: 190
max_extrude_only_distance: 100
## From the old config; re-run PID_CALIBRATE HEATER=extruder TARGET=245
control: pid
pid_Kp: 34.998
pid_Ki: 11.111
pid_Kd: 27.561
## Starting value for direct drive; tune per filament
pressure_advance: 0.025

[tmc2209 extruder]
uart_pin: EBBCan:PA15
interpolate: true
run_current: 0.85
sense_resistor: 0.110

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
voltage: 24
tuning_goal: auto


#####################################################################
##  Filament sensor - Orbiter filament sensor on the EBB36
#####################################################################
## Connected to the EBB36 I2C header (+5V, GND, PB3, PB4). Which of
## PB3/PB4 is runout and which is the button is still to be checked
## with QUERY_FILAMENT_SENSOR / QUERY_BUTTON (TODO.md). If they are the
## wrong way round, swap the two pins below.

[filament_switch_sensor filament_sensor]
switch_pin: ^EBBCan:PB4
## Pauses only while printing; RESUME is blocked until filament is back
pause_on_runout: True
runout_gcode:
    M117 Filament runout
event_delay: 3.0
pause_delay: 0.5

## Unload button on the sensor. Does nothing while printing or when
## the nozzle is cold, so a wrong pin can never start a heater.
[gcode_button filament_unload_button]
pin: ^!EBBCan:PB3
press_gcode:
    _BUTTON_UNLOAD


#####################################################################
##  Bed - 8mm aluminium, Keenovo silicone heater 220V 300W (~330W at
##  230V, 1.4A, ~160 Ohm), 125C thermal fuse, Omron G3NB-210B-1 SSR
#####################################################################

[heater_bed]
heater_pin: PF5
## Thermistor is plugged into the T0 port (PB0), not TB (PB1).
## Works as wired; do not "fix" the pin without moving the plug.
sensor_type: Generic 3950
sensor_pin: PB0
min_temp: 0
## 15C below the 125C thermal fuse: the silicone pad runs hotter than
## the plate while heating. Klipper shuts down above this, so use bed
## targets up to ~105C.
max_temp: 110
## PID instead of watermark: steady plate temperature = steady bed
## shape for the mesh. Start values from the Voron reference config,
## run PID_CALIBRATE HEATER=heater_bed TARGET=100 on first start.
control: pid
pid_Kp: 58.437
pid_Ki: 2.347
pid_Kd: 363.769
## 1.4A is far below the SSR rating, so no power limit needed
max_power: 1.0


#####################################################################
##  Probe - Chaoticlab CNC Voron Tap V2 on EBB36 probe port (PB9)
#####################################################################

[probe]
## ^! verified on the printer: QUERY_PROBE = open at rest,
## TRIGGERED with the nozzle pushed up
pin: ^!EBBCan:PB9
x_offset: 0
y_offset: 0
## z_offset lives in the SAVE_CONFIG block at the end of this file
speed: 5.0
lift_speed: 10
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    ## Never probe with a hot nozzle (protects the PEI)
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}
    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}


#####################################################################
##  Fans
#####################################################################
## Manta fan ports: voltage per port is set by jumper (5/12/24V).
## Check the jumpers match the fans BEFORE first start (TODO.md):
## the Noisblocker XR1 enclosure fans are 12V fans.

## Part cooling - EBB36 FAN1
[fan]
pin: EBBCan:PA0
kick_start_time: 0.5
off_below: 0.10

## Hotend fan - EBB36 FAN2
[heater_fan hotend_fan]
pin: EBBCan:PA1
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

## TMC5160 driver fans - Manta FAN0.
## On while the X/Y motors are enabled (or the hotend is heating),
## then 60s run-on.
[controller_fan driver_fans]
pin: PF7
kick_start_time: 0.5
stepper: stepper_x, stepper_y
idle_timeout: 60

## Electronics enclosure fans - Manta FAN1, FAN2, FAN3 as one fan.
## On while any motor is enabled or the bed/hotend is heating, then
## 120s run-on. Z stays enabled for the 30min idle_timeout after a
## print, so the fans keep cooling the Z drivers that long.
[multi_pin electronics_fan_pins]
pins: PF9, PF6, PF8

[controller_fan electronics_fans]
pin: multi_pin:electronics_fan_pins
kick_start_time: 0.5
heater: heater_bed, extruder
idle_timeout: 120

## Nevermore filters - not connected yet. Free Manta fan ports:
## FAN4 = PA4 (kept for the chamber light, option B below),
## FAN5 = PA6 (tach PC2), FAN6 = PA2 (tach PC1).
## Set the port jumper to the fans' voltage first.
## StealthMax S (chamber):
#[fan_generic nevermore_stealthmax]
#pin: PA6
#tachometer_pin: PC2
#kick_start_time: 0.5
#off_below: 0.10
## 3x under-bed Nevermore on one port (max 1A per port):
#[fan_generic nevermore_bed]
#pin: PA2
#tachometer_pin: PC1
#kick_start_time: 0.5
#off_below: 0.10
##
## Then in PRINT_START (e.g. for ABS/ASA, bed >= 90C):
##   SET_FAN_SPEED FAN=nevermore_stealthmax SPEED=1
##   SET_FAN_SPEED FAN=nevermore_bed SPEED=1
## and in PRINT_END, to keep filtering for 10 minutes:
##   UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION=600
#[delayed_gcode _NEVERMORE_OFF]
#gcode:
#    SET_FAN_SPEED FAN=nevermore_stealthmax SPEED=0
#    SET_FAN_SPEED FAN=nevermore_bed SPEED=0


#####################################################################
##  LEDs
#####################################################################

## Toolhead LEDs on the EBB36 RGB port. Rapid Burner = Stealthburner
## LED layout: index 1 logo, 2-3 nozzle, RGBW. VERIFY (TODO.md).
[neopixel toolhead]
pin: EBBCan:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.5

## Chamber light - 2x Daylight on a Stick v1.2 (24V). Wiring still to
## be checked (TODO.md). Uncomment ONE option after checking. Never
## enable a guessed heater output.
## Option A: on a free Manta heater output, HE2 = PA3 or HE3 = PA5
#[output_pin caselight]
#pin: PA3
#pwm: true
#cycle_time: 0.01
#value: 0
#shutdown_value: 0
## Option B: on a free 24V fan port, e.g. FAN4 = PA4 (jumper on 24V!)
#[output_pin caselight]
#pin: PA4
#pwm: true
#cycle_time: 0.01
#value: 0
#shutdown_value: 0
## Option C: straight on 24V = always on, nothing to configure.
##
## With A or B, a switch for Mainsail/KlipperScreen:
#[gcode_macro LIGHTS]
#description: Chamber light. S=0..1 (default 1)
#gcode:
#    SET_PIN PIN=caselight VALUE={params.S|default(1)|float}


#####################################################################
##  Leveling, mesh and homing
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
## Bed center (X 0-242 / Y 0-259)
home_xy_position: 121, 129
speed: 150
z_hop: 10
z_hop_speed: 15

[quad_gantry_level]
## Voron 2.4 250mm values. Order = stepper_z, z1, z2, z3:
## front left, rear left, rear right, front right.
gantry_corners:
    -60, -10
    310, 320
points:
    50, 25
    50, 175
    200, 175
    200, 25
speed: 150
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 217, 234
## 9x9 for a full bed check; ADAPTIVE=1 in PRINT_START uses fewer points
probe_count: 9, 9
algorithm: bicubic
mesh_pps: 2, 2
fade_start: 0.6
fade_end: 10.0
## Z=0 of the mesh at the Z homing point (bed center)
zero_reference_position: 121, 129
adaptive_margin: 5

## Needed for adaptive meshing and for cancelling single objects.
## In the slicer: enable "Label objects" (firmware-specific).
[exclude_object]

[gcode_arcs]
resolution: 0.1


#####################################################################
##  Accelerometer, input shaping, Shake&Tune
#####################################################################

## ADXL345 on the EBB36, hardware SPI2 (PB12 CS, PB10 SCK, PB2 MISO,
## PB11 MOSI). axes_map depends on how the EBB36 is mounted: check it
## with AXES_MAP_CALIBRATION from Shake&Tune (TODO.md).
[adxl345]
cs_pin: EBBCan:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x, y, z

[resonance_tester]
accel_chip: adxl345
probe_points:
    121, 129, 20

## Install Shake&Tune first (TODO.md), otherwise Klipper stops with
## "Section 'shaketune' is not a valid config section".
[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
show_macros_in_webui: True


#####################################################################
##  Macros
#####################################################################

## Settings for the print macros - change values here
[gcode_macro _PRINT_VARS]
## Heat soak in minutes: bed >= 90C counts as ABS/ASA
variable_soak_minutes_abs: 10
variable_soak_minutes_pla: 0
## Nozzle temperature while probing (Tap limit is 150C)
variable_probe_temp: 150
## Park position after a print (rear center)
variable_park_x: 121
variable_park_y: 250
## Purge line along the front edge
variable_purge_x_start: 25
variable_purge_x_end: 105
variable_purge_y: 10
## Auto power off after a print via the Shelly 2PM (TODO.md). Needs
## moonraker_power.conf included in moonraker.conf. Runs after the print
## has finished, so Moonraker's locked_while_printing allows it.
variable_power_off_after_print: False
variable_power_off_below_temp: 50
variable_power_device: "printer"
gcode:

## Mainsail PAUSE/RESUME/CANCEL settings (macros from mainsail.cfg)
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 121.0
variable_custom_park_y    : 250.0
variable_custom_park_dz   : 10.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 0
variable_runout_sensor    : "filament_switch_sensor filament_sensor"
variable_user_pause_macro : ""
variable_user_resume_macro: ""
variable_user_cancel_macro: "_CANCEL_CLEANUP"
gcode:

[gcode_macro G32]
description: Home, quad gantry level (coarse + fine), home Z again
gcode:
    ## Evaluated before anything below runs
    {% set needs_coarse = not printer.quad_gantry_level.applied %}
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    BED_MESH_CLEAR
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    STATUS_LEDS STATE=leveling
    {% if needs_coarse %}
        ## Gantry can be mm off after power loss: quick rough pass first
        QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1
    {% endif %}
    QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=5
    G28 Z
    G0 X121 Y129 Z30 F6000
    STATUS_LEDS STATE=ready
    RESTORE_GCODE_STATE NAME=STATE_G32

## Slicer start G-code (OrcaSlicer):
##   PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer]
## PrusaSlicer/SuperSlicer:
##   PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature]
## Optional: SOAK=<minutes> overrides the automatic heat soak.
[gcode_macro PRINT_START]
description: Heat, soak, level, adaptive mesh, purge
gcode:
    {% set v = printer["gcode_macro _PRINT_VARS"] %}
    {% set bed = params.BED|default(60)|float %}
    {% set hotend = params.EXTRUDER|default(params.HOTEND|default(210))|float %}
    {% set auto_soak = v.soak_minutes_abs if bed >= 90 else v.soak_minutes_pla %}
    {% set soak = params.SOAK|default(auto_soak)|int %}
    SAVE_GCODE_STATE NAME=STATE_PRINT_START
    CLEAR_PAUSE
    BED_MESH_CLEAR
    STATUS_LEDS STATE=heating
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    ## Nozzle over the bed center while heating
    G0 X121 Y129 Z20 F6000
    M104 S{v.probe_temp}
    M190 S{bed}
    {% for minute in range(soak) %}
        M117 Heat soak: {soak - minute} min left
        G4 P60000
    {% endfor %}
    M117 Leveling
    G32
    M117 Bed mesh
    BED_MESH_CALIBRATE ADAPTIVE=1
    M117 Heating nozzle
    M109 S{hotend}
    _PURGE_LINE
    M117 Printing
    STATUS_LEDS STATE=printing
    RESTORE_GCODE_STATE NAME=STATE_PRINT_START

[gcode_macro _PURGE_LINE]
description: 80mm purge line at the front of the bed
gcode:
    {% set v = printer["gcode_macro _PRINT_VARS"] %}
    SAVE_GCODE_STATE NAME=STATE_PURGE
    G90
    M83
    G0 Z5 F600
    G0 X{v.purge_x_start} Y{v.purge_y} F12000
    G0 Z0.3 F600
    ## 20mm filament over 80mm = 0.6mm2 line, below the 0.64mm2 default
    ## max_extrude_cross_section for a 0.4 nozzle
    G1 X{v.purge_x_end} E20 F1000
    G0 X{v.purge_x_end + 15} F6000
    G0 Z2 F600
    RESTORE_GCODE_STATE NAME=STATE_PURGE

## Slicer end G-code: PRINT_END
[gcode_macro PRINT_END]
description: Retract, heaters off, park at the rear
gcode:
    {% set v = printer["gcode_macro _PRINT_VARS"] %}
    {% set th = printer.toolhead %}
    {% set z_park = [th.position.z + 10, th.axis_maximum.z]|min %}
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400
    ## Heaters off first so nothing later can leave them on
    TURN_OFF_HEATERS
    M107
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-5 F2400
    {% endif %}
    G90
    G0 Z{z_park} F1200
    G0 X{v.park_x} Y{v.park_y} F6000
    BED_MESH_CLEAR
    STATUS_LEDS STATE=ready
    {% if v.power_off_after_print %}
        RESPOND MSG="Auto power off armed: printer turns off when the hotend is below {v.power_off_below_temp}C"
        UPDATE_DELAYED_GCODE ID=_POWER_OFF_WHEN_COOL DURATION=60
    {% endif %}
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

## Called by Mainsail's CANCEL_PRINT (user_cancel_macro)
[gcode_macro _CANCEL_CLEANUP]
gcode:
    BED_MESH_CLEAR
    STATUS_LEDS STATE=ready

[gcode_macro M600]
description: Filament change (pauses; use UNLOAD/LOAD_FILAMENT, then RESUME)
gcode:
    PAUSE

[gcode_macro LOAD_FILAMENT]
description: Heat (TEMP=, default 220) and load filament
gcode:
    {% set temp = [params.TEMP|default(220)|float, printer.extruder.target, 200]|max %}
    {% if printer.print_stats.state == "printing" %}
        RESPOND TYPE=error MSG="LOAD_FILAMENT is blocked while printing"
    {% else %}
        SAVE_GCODE_STATE NAME=STATE_LOAD
        M104 S{temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 5}
        M83
        G1 E50 F300
        G1 E25 F150
        M400
        RESTORE_GCODE_STATE NAME=STATE_LOAD
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Heat (TEMP=, default 220) and unload filament
gcode:
    {% set temp = [params.TEMP|default(220)|float, printer.extruder.target, 200]|max %}
    {% if printer.print_stats.state == "printing" %}
        RESPOND TYPE=error MSG="UNLOAD_FILAMENT is blocked while printing"
    {% else %}
        SAVE_GCODE_STATE NAME=STATE_UNLOAD
        M104 S{temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 5}
        M83
        ## Short push to soften the tip, fast pull, then clear the gears
        G1 E5 F300
        G1 E-15 F3000
        G1 E-60 F1200
        M400
        RESTORE_GCODE_STATE NAME=STATE_UNLOAD
    {% endif %}

## Unload button: only acts when the nozzle is already above
## min_extrude_temp (190C), then unloads at 220C or the current target
[gcode_macro _BUTTON_UNLOAD]
gcode:
    {% if printer.print_stats.state == "printing" %}
        RESPOND MSG="Unload button ignored while printing"
    {% elif not printer.extruder.can_extrude %}
        RESPOND MSG="Unload button: heat the nozzle first (or use UNLOAD_FILAMENT)"
    {% else %}
        UNLOAD_FILAMENT
    {% endif %}

[gcode_macro STATUS_LEDS]
description: Toolhead LEDs. STATE=off|ready|heating|leveling|printing|error
gcode:
    {% set colors = {
        "off":      [0.0, 0.0, 0.0, 0.0],
        "ready":    [0.0, 0.0, 0.0, 0.5],
        "heating":  [1.0, 0.3, 0.0, 0.0],
        "leveling": [0.0, 0.2, 1.0, 0.0],
        "printing": [0.0, 0.0, 0.0, 1.0],
        "error":    [1.0, 0.0, 0.0, 0.0]} %}
    {% set state = params.STATE|default("ready")|lower %}
    {% set c = colors[state] if state in colors else colors["ready"] %}
    SET_LED LED=toolhead RED={c[0]} GREEN={c[1]} BLUE={c[2]} WHITE={c[3]}

## Shelly power off, see _PRINT_VARS. Waits for the hotend to cool so
## the hotend fan can protect the heatbreak, and aborts if a new print
## has started.
[delayed_gcode _POWER_OFF_WHEN_COOL]
gcode:
    {% set v = printer["gcode_macro _PRINT_VARS"] %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND MSG="Auto power off cancelled: a print is running"
    {% elif printer.extruder.temperature > v.power_off_below_temp %}
        UPDATE_DELAYED_GCODE ID=_POWER_OFF_WHEN_COOL DURATION=30
    {% else %}
        RESPOND MSG="Hotend cool: switching off the printer"
        {action_call_remote_method("set_device_power", device=v.power_device, state="off")}
    {% endif %}

[gcode_macro POWER_OFF_PRINTER]
description: Clean CM4 shutdown, then the Shelly cuts 24V and 48V (refused while printing)
gcode:
    {% set v = printer["gcode_macro _PRINT_VARS"] %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="POWER_OFF_PRINTER refused: a print is running or paused"
    {% elif printer.extruder.temperature > v.power_off_below_temp %}
        RESPOND MSG="Hotend above {v.power_off_below_temp}C: waiting to cool, then powering off"
        TURN_OFF_HEATERS
        UPDATE_DELAYED_GCODE ID=_POWER_OFF_WHEN_COOL DURATION=1
    {% else %}
        RESPOND MSG="Powering off via Shelly"
        {action_call_remote_method("set_device_power", device=v.power_device, state="off")}
    {% endif %}

[gcode_macro AUTO_POWER_OFF]
description: ENABLE=1 turns the printer off after the current/next print (until restart)
gcode:
    {% set enable = params.ENABLE|default(1)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=power_off_after_print VALUE={enable}
    {% if not enable %}
        UPDATE_DELAYED_GCODE ID=_POWER_OFF_WHEN_COOL DURATION=0
    {% endif %}
    RESPOND MSG="Auto power off after print: {'ON' if enable else 'OFF'}"

[delayed_gcode _STARTUP]
initial_duration: 1
gcode:
    STATUS_LEDS STATE=ready

