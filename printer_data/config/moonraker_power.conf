# Shelly 2PM Gen4 printer power for Moonraker.
# Enable by adding this line to moonraker.conf, then restart Moonraker:
#   [include moonraker_power.conf]
# Replace SHELLY-IP (3x) with the Shelly's static IP.
#
# "off" calls the Shelly script's /off: it halts the CM4 through Moonraker,
# waits, then cuts 24 V and 48 V in order. "on" is only reachable while the
# CM4 runs, i.e. the printer is already on: power-on stays with the Shelly
# (button, app, Home Assistant, http://SHELLY-IP/script/1/on).
#
# The Shelly's IP must be a trusted client so it may call /machine/shutdown.
# The existing [authorization] trusted_clients in moonraker.conf already
# include 192.168.0.0/16 and 10.0.0.0/8, which covers a Shelly on the LAN.

[power printer]
type: http
on_url: http://SHELLY-IP/script/1/on
off_url: http://SHELLY-IP/script/1/off
status_url: http://SHELLY-IP/rpc/Switch.GetStatus?id=1
# on/off: the script answers with plain text, so report the command itself.
# status: read the 24 V relay (O2) from the Shelly's JSON reply.
response_template:
  {% if command == "status" %}
    {% if http_request.last_response().json()["output"] %}on{% else %}off{% endif %}
  {% else %}
    {command}
  {% endif %}
# Never switch off during a print (Mainsail button or macro)
locked_while_printing: True
# Keep power on after a Klipper shutdown: a cut would hard-stop the CM4 and
# the hotend fan while the hotend is hot. The bed's 125C thermal fuse and
# Klipper's verify_heater cover heater faults.
off_when_shutdown: False
